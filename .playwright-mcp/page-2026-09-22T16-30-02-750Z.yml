                - separator [ref=e323]
                - generic [ref=e324]:
                  - heading "1. Introduction" [level=2] [ref=e325]
                  - 'link "Permalink: 1. Introduction" [ref=e326] [cursor=pointer]':
                    - /url: "#1-introduction"
                - paragraph [ref=e329]: Large-scale global optimization (LSGO) is difficult due to high dimensionality, complex search spaces, and the risk of premature convergence in swarm methods. This paper proposes Heterogeneous Selection Learning Swarm Optimization (HSLSO), a PSO-based algorithm designed to improve global exploration while maintaining fast convergence.
                - paragraph [ref=e330]: "HSLSO introduces:"
                - list [ref=e331]:
                  - listitem [ref=e332]:
                    - strong [ref=e333]: (i) A hierarchical selection learning strategy
                    - text: that controls the generation of learning exemplars, to preserve population diversity and raise search efficiency.
                  - listitem [ref=e334]:
                    - strong [ref=e335]: (ii) A heterogeneous learning mechanism
                    - text: that adaptively adjusts particle update probabilities at different levels, to balance exploration and exploitation and reduce premature convergence.
                - paragraph [ref=e336]: Comprehensive tests on the CEC'2010 and CEC'2013 LSGO suites show that HSLSO consistently outperforms advanced PSO variants and recent cooperative coevolution methods, with gains confirmed by standard statistical tests. A real-world study on multiple sequence alignment modeled with Hidden Markov Models further indicates better solution quality than competing metaheuristics.
                - generic [ref=e337]:
